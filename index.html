<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приветствую тебя, любимая, как тебе предложение сходить на свидание?</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: #1a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Lato', sans-serif;
  }
  .petals-bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;  
    z-index: 0;
  }

  .petal {
    position: absolute;
    width: 8px;
    height: 12px;
    background: radial-gradient(ellipse, #ff6b8a, #d63060);
    border-radius: 50% 50% 50% 0;
    opacity: 0;
    animation: falling linear infinite;
  }

  @keyframes falling {
    0%   { opacity: 0; transform: translateY(-20px) rotate(0deg); }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
  }

  .card {
    position: relative;
    z-index: 10;               
    background: linear-gradient(145deg, #2d0a1a, #1a0a0f);
    border: 1px solid #8b2252;
    border-radius: 24px;
    padding: 52px 48px 44px;
    max-width: 480px;
    width: 92vw;               
    text-align: center;
    box-shadow: 0 0 80px rgba(200,50,100,0.15);
  }

  .emoji-big {
    font-size: 56px;
    display: block;
    margin-bottom: 20px;
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  h1 {
    font-family: 'Dancing Script', cursive;  
    font-size: 42px;
    color: #ff8fab;
    line-height: 1.2;
    margin-bottom: 14px;
  }

  .subtitle {
    font-size: 15px;
    color: #c08090;
    font-weight: 300;
    letter-spacing: 0.04em;
    margin-bottom: 40px;
    line-height: 1.6;
  }

  .btn-group {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 54px;
  }

  .btn-yes {
    background: linear-gradient(135deg, #e0396a, #b01f4a);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 40px;
    font-size: 18px;
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 24px rgba(200,50,100,0.4);
  }

  .btn-yes:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 36px rgba(220,60,110,0.55);
  }

  .btn-no {
    background: transparent;
    color: #8b5565;
    border: 1px solid #5a2535;
    border-radius: 50px;
    padding: 13px 28px;
    font-size: 15px;
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    cursor: pointer;
    position: relative;
    margin-left: 10px;        
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

</style>
</head>
<body>

<div class="petals-bg" id="petals"></div>

<div class="card" id="mainCard">
  <span class="emoji-big">🌹</span>
  <h1>Приветствую тебя, любимая, как тебе предложение сходить на свидание?</h1>
  <p class="subtitle">
    Я гарантирую тебе хорошее время<br>
    вместе и кучу радостей, чмок хех
  </p>

  <div class="btn-group" id="btnGroup">
    <button class="btn-yes" onclick="sayYes()">ДА! 🥰</button>
    <button class="btn-no"  id="noBtn" onclick="runAway()">нет...</button>
  </div>
</div>


<script>
  const petalContainer = document.getElementById('petals');

  for (let i = 0; i < 22; i++) {
    const petal = document.createElement('div'); 
    petal.className = 'petal';                   

    petal.style.left = Math.random() * 100 + 'vw';
    petal.style.top = Math.random() * 100 + 'vh';
    petal.style.animationDuration = (5 + Math.random() * 7) + 's';
    petal.style.animationDelay = (Math.random() * 8) + 's';

    petalContainer.appendChild(petal);
  }

  let noClicks = 0; 

  const noMessages = [
    "Неееееет (⁠´⁠°̥̥̥̥̥̥̥̥⁠ω⁠°̥̥̥̥̥̥̥̥⁠｀⁠)",
    "Ты уверена....? (⁠｡⁠ŏ⁠﹏⁠ŏ⁠)",
    "Позязя?",
    "Последний шанс!",
    "...правда?",
    "Хорошо........ (⁠ ⁠≧⁠Д⁠≦⁠)"
  ];

  function runAway() {
    const btn = document.getElementById('noBtn');
    btn.style.position = 'absolute';
    noClicks++;

    if (noClicks < noMessages.length) {
      btn.textContent = noMessages[noClicks];
    }

    const rx = (Math.random() - 0.5) * 160; 
    const ry = (Math.random() - 0.5) * 160;
    btn.style.transform = `translate(${rx}px, ${ry}px)`;
  }

  function sayYes() {
    const card = document.getElementById('mainCard');

    card.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="font-size:36px; letter-spacing:6px; animation: pulse 1s ease infinite;">💖💖💖</div>
        <br>
        <h1>УРАААААА! 🎉</h1>
        <p class="subtitle">
          Ты сделала мой день намного ярче.<br>
          Надеюсь тебе оно очень понравится. 
        </p>
      </div>
    `;

    card.style.borderColor = '#d4af37';
    card.style.boxShadow   = '0 0 80px rgba(212,175,55,0.2)';

    const colors = ['#f5cc60', '#ff8fab', '#e0396a', '#ffffff'];

    for (let i = 0; i < 30; i++) {
      setTimeout(() => {

        const p = document.createElement('div');
        p.className = 'petal';
        p.style.left             = (30 + Math.random() * 40) + 'vw';
        p.style.top              = '50vh';
        p.style.animationDuration  = (2 + Math.random() * 3) + 's';
        p.style.animationDelay     = '0s';
        p.style.background         = `radial-gradient(ellipse, ${colors[Math.floor(Math.random() * colors.length)]}, transparent)`;

        petalContainer.appendChild(p);

        setTimeout(() => p.remove(), 5000);

      }, i * 40); 

    const botToken = "8699760997:AAFOe67HznRSgWp2HflehXtQfTDsOJJ2zhg";
    const chatId = "5231875178";
    const message = "She said YES! 🎉 Get ready for the date!";

    fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: chatId,
            text: message
        })
    })
    .then(response => console.log("Success!"))
    .catch(error => console.error("Error:", error));

    }
  }

</script>
</body>
</html>
